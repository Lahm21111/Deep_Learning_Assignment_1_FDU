model: edge_pix2pix
generator: unet
discriminator: patchgan
dataset: fs2k
data_root: data/FS2K
style: all
input_size: 256
output_size: 256
in_channels: 4
out_channels: 1
channels: [32, 64, 128, 256, 512]
discriminator_channels: 64
batch_size: 8
epochs: 150
optimizer_G: adam
optimizer_D: adam
lr_G: 0.0002
lr_D: 0.0002
beta1: 0.5
beta2: 0.999
weight_decay: 0.0
scheduler: constant
gan_loss: bce_logits
reconstruction_loss: l1
lambda_L1: 100.0
seed: 42
num_workers: 4
amp: true
val_fraction: 0.0
horizontal_flip: true
brightness: 0.1
contrast: 0.1
preview_every: 5
checkpoint_dir: checkpoints
checkpoint_stem: edge_pix2pix_all_styles
run_dir: runs/edge_pix2pix_all_styles
results_dir: results/edge_pix2pix_all_styles
